<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23201C">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323201C'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23D4B26A' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<title>房租看板</title>
<style>
  :root{
    --paper:#F7F4EF; --card:#FFFFFF; --dark:#23201C;
    --gold:#B8893C; --goldl:#D4B26A;
    --ink:#14110E; --ink2:#5A5148; --ink3:#948B81;
    --line:#E7E0D6;
    --red:#C0453A; --green:#4F8060; --gray:#A79E95;
    --t-red:#FBEEEC; --t-gold:#FBF3E4; --t-gray:#F1EDE7; --t-green:#E9F2EB;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{
    margin:0;max-width:560px;margin:0 auto;background:var(--paper);color:var(--ink);
    font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:18px 18px calc(28px + var(--safe-b));
    overscroll-behavior-y:none;
  }
  /* 衬线数字，和工资单同一家 */
  .serif{font-family:"Bodoni 72",Didot,Georgia,"Times New Roman",serif;font-weight:400}

  /* ---------- 顶部深色块 ---------- */
  .hero{background:var(--dark);border-radius:20px;padding:22px 24px 18px;color:#B6ACA0;
        box-shadow:0 5px 20px rgba(60,48,36,.10)}
  .hero .date{font-size:13px;color:#8E857A}
  .hero .lab{font-size:14px;margin-top:16px}
  .hero .big{font-size:44px;line-height:1.1;color:var(--goldl);margin:4px 0 14px;
             letter-spacing:-.01em;word-break:break-all}
  .bar{height:6px;border-radius:3px;background:#3B352E;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--goldl)}
  .hero .sub{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:11px}
  .hero .nextrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
                 border-top:1px solid #38322C;margin-top:14px;padding-top:14px;font-size:13.5px}
  .hero .nextrow b{font-size:15px;color:var(--goldl);font-weight:600}

  /* ---------- 标签 ---------- */
  nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;
      border-bottom:1px solid var(--line);margin:20px 0 0}
  nav::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;font-size:15px;color:var(--ink3);padding:11px 0;cursor:pointer;
       position:relative;-webkit-user-select:none;user-select:none}
  .tab.on{color:var(--ink);font-weight:600}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}

  /* ---------- 分组标题 ---------- */
  .sec{font-size:13px;color:var(--ink3);margin:20px 2px 10px}

  /* ---------- 卡片 ---------- */
  .card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;
        padding:16px 14px 16px 16px;margin-bottom:9px;
        box-shadow:0 4px 16px rgba(60,48,36,.07);cursor:pointer}
  .card.done{opacity:.62}
  .badge{flex:none;width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;
         align-items:center;justify-content:center;line-height:1.1}
  .badge .m{font-size:10.5px;font-weight:500}
  .badge .d{font-size:21px;font-weight:600}
  .b-red{background:var(--t-red);color:var(--red)}
  .b-gold{background:var(--t-gold);color:var(--gold)}
  .b-gray{background:var(--t-gray);color:var(--gray)}
  .b-green{background:var(--t-green);color:var(--green)}
  .mid{flex:1;min-width:0}
  .mid .n{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .mid .s{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
  .amt{flex:none;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .amt.red{color:var(--red)}

  .tick{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid #DBD3C8;
        display:flex;align-items:center;justify-content:center;margin-left:2px}
  .tick.on{background:var(--green);border-color:var(--green)}
  .tick svg{display:none} .tick.on svg{display:block}

  /* ---------- 空状态 ---------- */

              display:flex;align-items:center;justify-content:center}
  .calm .t{font-size:16px;font-weight:600;color:#2F5A40}
  .calm .s{font-size:12.5px;color:#5C7A67;margin-top:2px}
  .calm.soon{background:var(--t-gold)}
  .calm.soon .ring{background:var(--gold)}
  .calm.soon .t{color:#7A5A21}
  .calm.soon .s{color:#8A7247}

  /* ---------- 详情 ---------- */
  .back{display:inline-block;font-size:15px;color:var(--ink3);padding:6px 0 14px;cursor:pointer}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
  .lede{font-size:13px;color:var(--ink3);margin:5px 0 18px}
  .panel{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px;
         box-shadow:0 4px 16px rgba(60,48,36,.07)}
  .panel .cap{font-size:13px;color:var(--ink3)}
  .panel .money{font-size:38px;margin:2px 0 4px;letter-spacing:-.01em}
  .chip{float:right;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:7px}
  .c-red{background:var(--t-red);color:var(--red)}
  .c-gold{background:var(--t-gold);color:var(--gold)}
  .c-gray{background:var(--t-gray);color:var(--gray)}
  .c-green{background:var(--t-green);color:var(--green)}
  .brk{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.7}
  button{font:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
  .btn{display:block;width:100%;padding:15px;border-radius:9px;background:var(--gold);
       color:#FCFAF7;font-size:16px;font-weight:600;letter-spacing:.06em;margin-top:16px}
  .btn.off{background:none;border:1px solid var(--line);color:var(--ink2);font-weight:400;letter-spacing:0}
  .btn:active{opacity:.65}

  .row{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .k{font-size:12px;color:var(--ink3)}
  .row .v{font-size:17px;font-weight:500;margin-top:2px;word-break:break-all}
  .cp{flex:none;padding:9px 15px;border:1px solid var(--gold);border-radius:8px;
      color:var(--gold);font-size:13px;font-weight:500}
  .cp:active{background:var(--t-gold)}
  .hist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .hist::-webkit-scrollbar{display:none}
  .hist>div{flex:none;text-align:center;min-width:58px;cursor:pointer}
  .hist .hm{font-size:12px;color:var(--ink3)}
  .hist .hd{width:34px;height:34px;border-radius:50%;margin:6px auto 0;border:2.5px solid #DBD3C8;
            display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px}
  .hist .hd.on{background:var(--green);border-color:var(--green)}
  .hist .hd.miss{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .hist .hn{font-size:11px;color:var(--ink3);margin-top:5px;height:14px}

  /* ---------- 表单 ---------- */
  .f{padding:12px 0;border-bottom:1px solid var(--line)}
  .f label{display:block;font-size:12px;color:var(--ink3)}
  .f input,.f select{width:100%;border:0;background:transparent;padding:4px 0 0;
    font:600 17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:var(--ink);min-height:32px;appearance:none;border-radius:0}
  .f input:focus,.f select:focus{outline:none}
  .f:focus-within{border-bottom-color:var(--gold)}
  .f .tip{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.6}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .foot{font-size:12px;color:var(--ink3);text-align:center;margin-top:26px;line-height:1.9}
  .foot a{color:var(--gold);text-decoration:none}
  /* ---------- 出图浮层 ---------- */
  .veil{position:fixed;inset:0;z-index:60;display:none;background:rgba(18,15,12,.9);
        flex-direction:column;align-items:center;justify-content:center;gap:14px;
        padding:14px;padding-bottom:calc(14px + var(--safe-b))}
  .veil.on{display:flex}
  .veil img{max-width:100%;max-height:76vh;border-radius:8px;
            box-shadow:0 10px 40px rgba(0,0,0,.4);object-fit:contain}
  .veil .tip{color:#CFC6BB;font-size:13px;text-align:center;line-height:1.8}
  .vacts{display:flex;gap:10px;width:100%;max-width:420px}
  .vacts>*{flex:1;text-align:center;padding:14px 10px;border-radius:8px;font-size:15px;
           text-decoration:none;font-weight:500}
  .vacts .dl{background:var(--gold);color:#FCFAF7}
  .vacts button{border:1px solid #6A6157;color:#CFC6BB;background:none}

  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:11px;
    font:400 12px/1.5 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink2);
    resize:vertical}
</style>

<body>
<div id="app"></div>

<div class="veil" id="veil">
  <img id="veilImg" alt="租金通知单">
  <div class="tip">长按图片保存到相册<br>然后在微信里发给租客</div>
  <div class="vacts">
    <a class="dl" id="veilDl" download>保存图片</a>
    <button onclick="closeVeil()">关闭</button>
  </div>
</div>

<script>
/* ==================================================================
   房租看板
   数据全在这台设备的 localStorage 里，仓库里一个字都没有。
   换设备靠「生成链接」把数据编码进网址，不需要服务器。
   ================================================================== */

const KEY = "rent-board-v1";
const STEP     = { m:1,  q:3,  h:6  };   // 一期几个月
const PER_YEAR = { m:12, q:4,  h:2  };   // 一年几期
const CYCLE    = { m:"月付", q:"季付", h:"半年付" };
const LEAD     = { "0":"", "1m":"提前一个月", "7d":"提前一周" };

/* ---------- 出厂数据 ----------
   只写门面的「结构」：名字、每期金额、到期日、提前多久。

   租客微信名（wx）和房东姓名 / 地址 / 微信号（landlord / addr / wxid）
   一律留空，不许往这里填。这个仓库是公开的，写进来就等于公开在网上，
   而且进了 git 历史删不掉。那几项在各自手机上用「修改这个门面」填，
   填完只存在那台手机的 localStorage 里。

   paid 是 2026-08-28 那天的快照，只在全新设备第一次打开时用一次；
   之后任何一次打勾都会把整份数据存进本机，出厂数据不再介入。      */
const SEED = { v:1, units:[
  { id:"u1", name:"金融中心",   cycle:"q", dueMonth:11, dueDay:1,  lead:"1m", rent:21000, fee:546  },
  { id:"u2", name:"未来方舟",   cycle:"q", dueMonth:9,  dueDay:2,  lead:"1m", rent:25000, fee:840  },
  { id:"u3", name:"中天写字楼", cycle:"h", dueMonth:11, dueDay:1,  lead:"1m", rent:24000, fee:0, feeSelf:1 },
  { id:"u4", name:"碧桂园",     cycle:"q", dueMonth:9,  dueDay:6,  lead:"7d", rent:24789, fee:0, feeSelf:1 },
  { id:"u5", name:"会展城",     cycle:"h", dueMonth:12, dueDay:1,  lead:"1m", rent:96000, fee:1534 },
  { id:"u6", name:"紫林",       cycle:"m", dueMonth:1,  dueDay:12, lead:"0",  rent:1224,  fee:0    }
].map(u=>Object.assign({ wx:"", landlord:"", addr:"", wxid:"" }, u)),
paid:{
  u1:["2026-01","2026-04","2026-07"],
  u2:["2026-02","2026-05","2026-08"],
  u3:["2026-04"],
  u4:["2026-02","2026-05"],
  u5:["2026-05"],
  u6:["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08"]
}};

/* ---------- 数据 ---------- */
let FROM_SEED = false;                       // 这份是出厂数据，还没被人动过
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.units) return migrate(d); }catch(e){}
  FROM_SEED = true;
  return migrate(JSON.parse(JSON.stringify(SEED)));
}
function save(){ FROM_SEED=false; localStorage.setItem(KEY, JSON.stringify(DB)); }

/* 老格式的收租记录是一串期号 ["2026-07"]，只知道「这期收了」，
   不知道租客到底哪天给的。新格式是 { "2026-07": "2026-07-03" }。
   迁移时按「准时交」补上该收日当天，之后可以在详情页改成实际那天。 */
function migrate(d){
  d.paid = d.paid || {};
  (d.units||[]).forEach(u=>{
    const p = d.paid[u.id];
    if(!Array.isArray(p)) return;
    const o = {};
    p.forEach(k=>{ const dt=payDateOfKey(u,k); o[k] = dt ? ymdLocal(dt) : ""; });
    d.paid[u.id] = o;
  });
  return d;
}
/* 期号 → 那一期的该收日 */
function payDateOfKey(u,k){
  const step=STEP[u.cycle], y=+k.slice(0,4);
  for(let mm=1; mm<=12; mm++){
    if(((((mm-u.dueMonth)%step)+step)%step)!==0) continue;
    for(const yy of [y-1,y,y+1]){
      const pay=payOf(u, mk(yy,mm,u.dueDay));
      if(pkey(pay)===k) return pay;
    }
  }
  return null;
}
let DB = load();

/* ---------- 日期 ----------
   存的是「到期日」（几月几号）+「提前多久」。
   该收钱的日子 = 到期日往前推。全程没有任何日期被改写，
   都是拿今天现算出来的。                                        */
function pad2(n){ return String(n).padStart(2,"0"); }
function dim(y,m){ return new Date(y,m,0).getDate(); }     // m 是 1-12
function mk(y,m,d){                                        // 跨年 + 月末夹取
  while(m>12){ m-=12; y++; }
  while(m<1) { m+=12; y--; }
  return new Date(y, m-1, Math.min(d, dim(y,m)));
}
function pkey(dt){ return dt.getFullYear()+"-"+pad2(dt.getMonth()+1); }
const md      = dt => (dt.getMonth()+1)+" 月 "+dt.getDate()+" 日";
const mdTight = dt => (dt.getMonth()+1)+"月"+dt.getDate()+"日";
const diff    = (a,b) => Math.round((b-a)/86400000);
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }

/* 到期日 → 该收日 */
function payOf(u, due){
  if(u.lead==="1m") return mk(due.getFullYear(), due.getMonth(), u.dueDay);   // 往前一个月
  if(u.lead==="7d"){ const d=new Date(due); d.setDate(d.getDate()-7); return d; }
  return due;
}
/* 最近一个已到的该收日 + 下一个 */
function periods(u, ref){
  const step=STEP[u.cycle], list=[];
  for(let y=ref.getFullYear()-1; y<=ref.getFullYear()+1; y++)
    for(let m=1; m<=12; m++)
      if(((((m-u.dueMonth)%step)+step)%step)===0){
        const due=mk(y,m,u.dueDay);
        list.push({ due, pay:payOf(u,due) });
      }
  list.sort((a,b)=>a.pay-b.pay);
  let cur=null,next=null;
  for(const p of list){ if(p.pay<=ref) cur=p; else { next=p; break; } }
  return {cur,next};
}

const amountOf = u => (+u.rent||0)+(+u.fee||0);
const paidMap  = id => DB.paid[id] || (DB.paid[id]={});
const paidKeys = id => Object.keys(paidMap(id));
const isPaid   = (id,k) => paidMap(id)[k] !== undefined;
const paidOn   = (id,k) => paidMap(id)[k] || "";       // 实收日期，"" = 没记
function ymdLocal(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function markPaid(id,k,dateStr){ paidMap(id)[k] = dateStr || ""; save(); }
function unmarkPaid(id,k){ delete paidMap(id)[k]; save(); }
function togglePaid(id,k,dateStr){
  if(isPaid(id,k)) unmarkPaid(id,k); else markPaid(id,k,dateStr||ymdLocal(today()));
}

/* 一个门面此刻的状态 */
function stateOf(u){
  const t=today(), {cur,next}=periods(u,t);
  const amt=amountOf(u);
  const curKey=cur?pkey(cur.pay):null;
  const done=curKey && isPaid(u.id,curKey);
  const badgeM = u.cycle==="m" ? "每月" : null;

  if(cur && !done){
    const od=diff(cur.pay,t);
    return { g:0, key:curKey, amt, done:false, c: od===0?"gold":"red",
             bm: badgeM||((cur.pay.getMonth()+1)+" 月"), bd: cur.pay.getDate(),
             sub: od===0?"今天该收":"逾期 "+od+" 天",
             target:cur, curPay:cur.pay };
  }
  const nd=diff(t,next.pay);
  const since=cur?diff(cur.pay,t):9999;
  if(since<=31){   // 刚收不久，归到「本期已收」
    return { g:2, key:curKey, amt, done:true, c:"green", curPay:cur.pay,
             bm: badgeM||((next.pay.getMonth()+1)+" 月"), bd: next.pay.getDate(),
             sub: md(cur.pay)+"已收", target:next };
  }

  return { g:1, key:curKey, amt, done:true, c:"gray", curPay:cur?cur.pay:null,
           bm: badgeM||((next.pay.getMonth()+1)+" 月"), bd: next.pay.getDate(),
           sub:"还有 "+nd+" 天", target:next };
}

/* ---------- 汇总 ---------- */
const yuan = v => "¥"+(+v||0).toLocaleString("zh-CN");
function yearStats(){
  const y=new Date().getFullYear();
  let got=0,total=0;
  DB.units.forEach(u=>{
    const a=amountOf(u);
    total += a*PER_YEAR[u.cycle];
    paidKeys(u.id).forEach(k=>{ if(k.slice(0,4)==String(y)) got+=a; });
  });
  return {got,total,pct: total?Math.round(got/total*100):0};
}

/* ---------- 视图 ---------- */
let VIEW={n:"home"}, FILTER="all";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const go  = v => { VIEW=v; window.scrollTo(0,0); render(); };
const CHECK='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const BELL='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';

function render(){
  const el=document.getElementById("app");
  if(VIEW.n==="home")   el.innerHTML=vHome();
  if(VIEW.n==="detail") el.innerHTML=vDetail(DB.units.find(u=>u.id===VIEW.id));
  if(VIEW.n==="edit")   el.innerHTML=vEdit(DB.units.find(u=>u.id===VIEW.id));
  if(VIEW.n==="set")    el.innerHTML=vSet();
}

/* ---------- 首页 ---------- */
function vHome(){
  if(!DB.units.length) return `
    <div class="hero">
      <div class="date">房租看板</div>
      <div class="lab">还没有门面</div>
      <div class="big serif">¥0</div>
      <div class="sub"><span>加进来之后，这里显示今年收了多少</span></div>
    </div>
    <button class="btn" onclick="go({n:'edit',id:null})">＋ 添加第一个门面</button>
    <button class="btn off" onclick="go({n:'set'})">从链接导入</button>
    <p class="foot"><a href="index.html">← 回工资单</a></p>`;

  const t=today(), s=yearStats();
  const rows=DB.units.map(u=>({u, st:stateOf(u)}))
    .filter(r=>FILTER==="all"||r.u.cycle===FILTER);

  const due =rows.filter(r=>r.st.g===0).sort((a,b)=>a.st.target.pay-b.st.target.pay);
  const soon=rows.filter(r=>r.st.g===1).sort((a,b)=>a.st.target.pay-b.st.target.pay);

/* ---------- 详情 ---------- */
/* 今年这个门面的所有收租日（半年付就 2 个，月付 12 个）+ 下一期 */
function yearPeriods(u, year){
  const step=STEP[u.cycle], out=[];
  for(let m=1;m<=12;m++){
    if(((((m-u.dueMonth)%step)+step)%step)!==0) continue;
    const due=mk(year,m,u.dueDay), pay=payOf(u,due);
    if(pay.getFullYear()===year) out.push({due,pay});
  }
  return out.sort((a,b)=>a.pay-b.pay);
}

                                    : (u.feeSelf ? "（物业费租客自付）" : "") }<br>
      该收日 ${md(tg.pay)}${ u.lead!=="0" ? "　·　"+mdTight(tg.due)+"到期" : "" }
      ${ +u.fee ? "<br><span style=\"color:var(--gold)\">其中物业 "+yuan(u.fee)+" 收到后要转交物业公司</span>" : "" }
    </div>

    <div class="f" style="margin-top:16px">

      <input type="date" id="pd" value="${done ? (paidOn(u.id,key)||ymdLocal(tg.pay)) : ymdLocal(t)}"
             ${done?`onchange="markPaid('${u.id}','${key}',this.value);render()"`:""}>
      <div class="tip">${done ? "租客实际是哪天给的" : "租客提前或晚几天给都行，改成实际那天再确认"}</div>
    </div>

    ${ done
      ? `<button class="btn off" onclick="unmarkPaid('${u.id}','${key}');render()">撤销「已收」</button>`
      : `<button class="btn" onclick="markPaid('${u.id}','${key}',document.getElementById('pd').value);render()">确认收到</button>` }
    <button class="btn off" onclick="saveNotice('${u.id}')">出一张通知单发给他</button>

  <div class="panel">
    <div class="hist">

function saveUnit(id){

  const cycle=g("cycle");
  const o={
    id: id || ("u"+Date.now().toString(36)),
    name, wx:g("wx"), cycle,
    dueMonth: cycle==="m" ? 1 : +g("dm"),
    dueDay: +g("dd"), lead:g("lead"),
    rent:+g("rent")||0, fee:+g("fee")||0,
    landlord:g("landlord"), addr:g("addr"), wxid:g("wxid")
  };
  const i=DB.units.findIndex(u=>u.id===id);
  if(i>=0) DB.units[i]=o; else DB.units.push(o);
  save(); go({n:"detail",id:o.id});
}
function delUnit(id){

  DB.units=DB.units.filter(u=>u.id!==id); delete DB.paid[id];
  save(); go({n:"home"});
}

/* ==================================================================
   出图：给租客的租金通知单 / 收据
   1080×动态高，canvas 手绘。手机上长按图片就能存进相册。
   ================================================================== */
function rmbUpper(num){
  const D="零壹贰叁肆伍陆柒捌玖".split(""), U=["","拾","佰","仟"];
  const sec=n=>{let s="",z=false,k=0;
    while(n>0){const d=n%10;
      if(d===0){if(s)z=true;}else{s=D[d]+U[k]+(z?"零":"")+s;z=false;}
      n=(n-d)/10;k++;} return s;};
  let t=Math.round(Math.abs(num)*100);
  const fen=t%10; t=(t-fen)/10; const jiao=t%10; t=(t-jiao)/10;
  const yuan=t, yi=Math.floor(yuan/1e8), wan=Math.floor(yuan/1e4)%1e4, low=yuan%1e4;
  let s="";
  if(yi)s+=sec(yi)+"亿";
  if(wan)s+=sec(wan)+"万"; else if(yi&&low)s+="零";
  if(low){ if((yi||wan)&&low<1000)s+="零"; s+=sec(low); }
  if(!s)s="零";
  s+="元";
  if(!jiao&&!fen)s+="整"; else{ s+=jiao?D[jiao]+"角":"零"; if(fen)s+=D[fen]+"分"; }
  return s;
}
const yuan2 = v => "¥"+(+v||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd   = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());

/* 一期租赁期间：到期日当天起，往后一个周期减一天 */
function leaseSpan(u, due){
  const end = mk(due.getFullYear(), due.getMonth()+1+STEP[u.cycle], u.dueDay);
  end.setDate(end.getDate()-1);
  return [due, end];
}

let _paper=null;
function drawNotice(u){
  const t=today(), st=stateOf(u), tg=st.target;   // 该收了→本期；已收→下一期
  if(!tg) return null;
  const [s0,s1] = leaseSpan(u, tg.due);

  /* 费用行：代收 / 自付 / 没有物业费，三种写法不一样 */
  const items=[["租金", +u.rent||0, ""]];
  if(+u.fee)        items.push(["代收物业费", +u.fee, "由我方代收后转交物业公司"]);
  else if(u.feeSelf) items.push(["物业费", 0, "由承租方自行向物业缴纳，不含在本单内"]);
  const total = items.reduce((n,i)=>n+i[1], 0);

  const W=1080, M=36, PAD=88, TW=W-PAD*2, TX=PAD;
  const rowH = items.map(i=>i[2]?114:70);
  const boxH = rowH.reduce((a,b)=>a+b,0)+96;
  const H = 660 + boxH + 300;

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const INK="#141210", INK2="#5F564D", INK3="#9C938A";
  const AC="#A9873F", LITE="#C9B183", BD="#D8CDBB", TINT="#F2EEE7";
  const F=(w,sz)=>`${w} ${sz}px -apple-system,"SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif`;
  const SONG=(w,sz)=>`${w} ${sz}px "Songti SC","STSong",serif`;
  const SERIF=sz=>`400 ${sz}px Didot,"Bodoni 72",Georgia,serif`;

  x.fillStyle="#FAF8F5"; x.fillRect(0,0,W,H);
  if(!_paper){                                   // 纸张噪点，贴一次反复用
    const N=128,tc=document.createElement("canvas"); tc.width=tc.height=N;
    const g=tc.getContext("2d"), im=g.createImageData(N,N);
    for(let i=0;i<im.data.length;i+=4){const v=(Math.random()*255)|0;
      im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=12;}
    g.putImageData(im,0,0); _paper=tc;
  }
  x.fillStyle=x.createPattern(_paper,"repeat"); x.fillRect(0,0,W,H);

  const track=(txt,px,py,sp,font,st,al)=>{
    x.font=font; x.fillStyle=st;
    let tot=0; for(const ch of txt) tot+=x.measureText(ch).width+sp; tot-=sp;
    let cx = al==="center"?px-tot/2 : al==="right"?px-tot : px;
    x.textAlign="left";
    for(const ch of txt){ x.fillText(ch,cx,py); cx+=x.measureText(ch).width+sp; }
  };

  x.strokeStyle=LITE; x.lineWidth=2.5; x.strokeRect(M+.5,M+.5,W-M*2-1,H-M*2-1);
  x.strokeStyle=BD;   x.lineWidth=1;   x.strokeRect(M+9.5,M+9.5,W-M*2-19,H-M*2-19);

  track("租金通知单", W/2,168,13,SONG(600,50),INK,"center");
  x.fillStyle=AC; x.fillRect(W/2-125,192,250,1.5);
  track("RENT  NOTICE", W/2,226,6,SERIF(17),LITE,"center");
  x.fillStyle=BD; x.fillRect(TX,266,TW,1);

  x.textAlign="left";
  x.font=F(600,54); x.fillStyle=INK; x.fillText(u.name,TX,340);
  if(u.wx){ x.font=F(400,28); x.fillStyle=INK3; x.fillText(u.wx,TX,388); }
  x.fillStyle=BD; x.fillRect(TX,420,TW,1);

  let yy=478;
  [["租赁期间", ymd(s0)+" 至 "+ymd(s1)],
   ["付款周期", CYCLE[u.cycle]==="月付"?"每月一次":CYCLE[u.cycle]==="季付"?"每季度一次":"每半年一次"],
   ["应交日期", ymd(tg.pay)]
  ].forEach(([k,v],i,arr)=>{
    const last=i===arr.length-1;
    x.font=F(400,25); x.fillStyle=INK3; x.textAlign="left"; x.fillText(k,TX,yy);
    x.font=F(last?600:500,27); x.fillStyle=last?AC:INK2; x.textAlign="right"; x.fillText(v,W-PAD,yy);
    yy+=52;
  });

  yy=660;
  x.strokeStyle=BD; x.lineWidth=1; x.strokeRect(TX+.5,yy+.5,TW-1,boxH-1);
  let ry=yy;
  items.forEach(([name,amt,note],i)=>{
    if(i){ x.fillStyle="#EFE9E1"; x.fillRect(TX+28,ry,TW-56,1); }
    x.font=F(500,29); x.fillStyle=INK; x.textAlign="left"; x.fillText(name,TX+28,ry+46);
    x.font=F(600,31); x.fillStyle=amt?INK:INK3; x.textAlign="right";
    x.fillText(amt?yuan2(amt):"自付",W-PAD-28,ry+46);
    if(note){ x.font=F(400,22); x.fillStyle=INK3; x.textAlign="left"; x.fillText(note,TX+28,ry+84); }
    ry+=rowH[i];
  });
  x.fillStyle=TINT; x.fillRect(TX+1,ry,TW-2,95);
  x.fillStyle=AC;   x.fillRect(TX,ry,TW,1.5);
  x.font=F(600,30); x.fillStyle=INK; x.textAlign="left";
  x.fillText("本期应交合计",TX+28,ry+60);
  x.font=F(600,44); x.fillStyle=AC; x.textAlign="right";
  x.fillText(yuan2(total),W-PAD-28,ry+62);

  yy=660+boxH+30;
  x.strokeStyle=BD; x.lineWidth=1; x.strokeRect(TX+.5,yy+.5,TW-1,84);
  x.font=F(400,22); x.fillStyle=INK3; x.textAlign="left";
  x.fillText("人民币（大写）",TX+28,yy+50);
  track(rmbUpper(total),W-PAD-28,yy+55,2,SONG(600,32),INK,"right");

  x.fillStyle=BD; x.fillRect(TX,H-M-84,TW,1);
  track(t.getFullYear()+" 年 "+(t.getMonth()+1)+" 月 "+t.getDate()+" 日 开具",
        W/2,H-M-42,2,F(400,21),INK3,"center");
  return c;
}

function saveNotice(id){
  const u=DB.units.find(x=>x.id===id);
  const c=drawNotice(u);
  if(!c){ alert("这个门面还没有可出的账期"); return; }
  const tg=stateOf(u).target;
  c.toBlob(b=>{
    const url=URL.createObjectURL(b);
    document.getElementById("veilImg").src=url;
    const a=document.getElementById("veilDl");
    a.href=url;
    a.download=u.name+"-"+pkey(tg.pay)+"-租金通知.png";
    document.getElementById("veil").classList.add("on");
  },"image/png");
}
function closeVeil(){ document.getElementById("veil").classList.remove("on"); }

/* ---------- 复制 ---------- */
function copy(btn,text){
  const old=btn.textContent;
  const ok=()=>{ btn.textContent="已复制"; setTimeout(()=>btn.textContent=old,1400); };
  const fb=()=>{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.top="-999px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ alert("复制失败，请长按选中"); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(ok,fb);
  else fb();
}

/* ---------- 从链接导入 ---------- */
(function(){
  const m=location.hash.match(/^#d=(.+)$/);
  if(!m) return;
  const done=()=>history.replaceState(null,"",location.pathname);
  let d;
  try{
    d=JSON.parse(b64d(m[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(!d.units) throw 0;
  }catch(e){ done(); alert("链接里的数据读不出来"); return; }

  /* 手机上本来就是空的就直接装，不弹框问。
     第一次打开时问「会覆盖现有记录」既吓人又没意义，点错一下链接就白点了。 */
  if(!FROM_SEED && DB.units.length &&
     !confirm("导入 "+d.units.length+" 个门面？\n会覆盖这台手机上现在的 "+DB.units.length+" 个。")){
    done(); return;
  }
  DB=d; save(); done();
})();

render();
</script>
