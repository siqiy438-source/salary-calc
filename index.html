<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工资核算 · GC</title>
<style>
  :root{
    --bg:#f6f4f0; --card:#fff; --ink:#1c1a17; --ink2:#6b6459; --line:#e3ded5;
    --accent:#174d3a; --accent-soft:#e8f0eb; --gold:#a8863f; --warn:#b4462f;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:20px 16px 60px; max-width:940px; margin:0 auto;
  }
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:400;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px}
  .rule{font-size:12px;color:var(--ink2);margin:0 0 12px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  input[type=number]{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
    font-size:16px;background:#fcfbf9;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus{outline:none;border-color:var(--accent);background:#fff}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .out{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--ink2)}
  .row span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
  .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:9px;font-size:16px;font-weight:600;color:var(--ink)}
  .row.total span:last-child{color:var(--accent)}
  .row.muted span:last-child{color:var(--ink2)}
  .miss{color:var(--warn)}
  .store{background:var(--accent);color:#fff;border-color:var(--accent)}
  .store h2,.store .rule{color:#fff}
  .store .rule{opacity:.75}
  .store label{color:rgba(255,255,255,.75)}
  .store input[type=number]{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
  .store input[type=number]:focus{background:rgba(255,255,255,.2);border-color:#fff}
  .sum{background:#1c1a17;color:#fff;border-color:#1c1a17}
  .sum h2{color:#fff}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sum table{width:100%;min-width:290px;border-collapse:collapse;font-size:13px;margin-top:8px}
  .neg{color:var(--warn)}
  .sum td.neg{color:#ff9b86}
  .sum th,.sum td{padding:7px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.12);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sum th{color:rgba(255,255,255,.6);font-weight:400;font-size:11px}
  .sum th:first-child,.sum td:first-child{text-align:left}
  .sum tfoot td{border-bottom:none;font-weight:600;font-size:15px;padding-top:10px}
  .sum tfoot td:last-child{color:var(--gold)}
  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{
    flex:1;min-width:120px;padding:11px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit
  }
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:active{opacity:.7}
  .foot{font-size:11px;color:var(--ink2);text-align:center;margin-top:26px;line-height:1.9}
  @media (max-width:430px){
    .sum table{font-size:12px}
    .sum th,.sum td{padding:7px 3px}
  }
  @media print{
    body{padding:0;max-width:none}
    .card{break-inside:avoid;border-color:#ccc}
    .btns,.foot{display:none}
    .store,.sum{background:#fff!important;color:#000!important;border-color:#ccc!important}
    .store h2,.store .rule,.store label,.sum h2{color:#000!important}
    .sum th,.sum td{border-color:#ddd!important;color:#000!important}
    .sum tfoot td:last-child{color:#000!important}
  }
</style>
</head>
<body>

<h1>工资核算</h1>
<p class="sub">业绩一律填<b>元</b>（62 万 8 千就填 628000）。数据只存在你自己的浏览器里，不上传。</p>

<div class="card store">
  <h2>本月总数</h2>
  <p class="rule">总店业绩：店长的总店提成、财务与配送的业绩奖金都以它为基数。<br>本月天数：请假扣款的日薪就是拿它去除（3 月填 31、4 月填 30、2 月填 28）。</p>
  <div class="grid">
    <div>
      <label>本月总店业绩（元）</label>
      <input type="number" id="storePerf" min="0" step="1000" placeholder="0">
    </div>
    <div>
      <label>本月天数</label>
      <input type="number" id="monthDays" min="28" max="31" step="1">
    </div>
  </div>
</div>

<!-- 员工卡片由 JS 渲染 -->
<div id="staff"></div>

<div class="card sum">
  <h2>本月汇总</h2>
  <div class="scroll">
  <table>
    <thead>
      <tr><th>姓名</th><th>底薪</th><th>提成/奖金</th><th>扣减</th><th>实发</th></tr>
    </thead>
    <tbody id="sumBody"></tbody>
    <tfoot><tr><td>合计</td><td></td><td></td><td></td><td id="sumAll">¥0</td></tr></tfoot>
  </table>
  </div>
</div>

<div class="btns">
  <button class="primary" onclick="window.print()">打印 / 存 PDF</button>
  <button onclick="copyText()">复制明细</button>
  <button onclick="resetAll()">清空重填</button>
</div>

<p class="foot">
  个人提成门槛与比例：店长、销售一视同仁，个人业绩满 15 万起提，满 20 万跳高档。<br>
  财务与配送的业绩奖金按「每满 10 万」计一次，不足 10 万的零头不计。<br>
  请假扣款的日薪基数不含全勤奖（全勤奖是超 2 天时整笔扣掉的）。
</p>

<script>
/* ============ 规则配置：改这里就行 ============ */
const WAN = 10000;                      // 只用来把档位门槛写成「20 万档」这种文案

const RULES = {
  store: { rate: 0.001, min: 600000 },  // 总店提成：千分之一，总店满 60 万才有

  // 个人业绩提成：店长和销售用同一套档位
  tiers: [                              // 从高到低匹配
    { min: 200000, acd: 0.02, b: 0.01  },   // 满 20 万：A/C/D 2%，B 1%
    { min: 150000, acd: 0.01, b: 0.005 }    // 满 15 万：A/C/D 1%，B 0.5%
  ],
  floor: 150000,                        // 个人业绩低于此额度无提成

  // 各岗位工资构成。日薪基数 =（基本 + 社保 + 中餐），不含全勤奖
  // freeDays：每月正常休息天数，请假在这个数以内不扣
  manager: {                            // 店长
    pay: { basic: 8000, social: 0, attend: 0, meal: 0 },
    freeDays: 0
  },

  sales: {                              // 销售
    pay: { basic: 2500, social: 1200, attend: 500, meal: 300 },
    freeDays: 2
  },

  finance: {                            // 财务
    pay: { basic: 5200, social: 1200, attend: 100, meal: 300 },
    freeDays: 2
  },

  delivery: {                           // 配送
    pay: { basic: 4200, social: 1200, attend: 100, meal: 300 },
    freeDays: 2,
    perTrip: 15                         // 每趟 15 元
  },

  // 财务 / 配送 共用的业绩奖金：每满 10 万算一格，零头不算
  // 满 60 万后单价翻倍，且是全部格子都按 200（70 万 = 7 × 200 = 1400）
  perfBonus: [
    { min: 600000, per100k: 200 },   // 满 60 万：每 10 万 200
    { min: 400000, per100k: 100 }    // 满 40 万：每 10 万 100
  ]
};

// 由工资构成推导出：底薪合计、构成说明、日薪基数（不含全勤奖）
["manager","sales","finance","delivery"].forEach(t => {
  const p = RULES[t].pay, n = x => x.toLocaleString("zh-CN");
  RULES[t].base = p.basic + p.social + p.attend + p.meal;
  RULES[t].dailyBase = p.basic + p.social + p.meal;
  RULES[t].baseNote = (p.social || p.attend || p.meal)
    ? `基本 ${n(p.basic)} + 社保 ${n(p.social)} + 全勤 ${n(p.attend)} + 中餐 ${n(p.meal)}`
    : `基本工资 ${n(p.basic)}`;
});

/* ============ 员工名单：加人删人改这里 ============ */
const STAFF = [
  { id:"wuxuan",   name:"吴璇",   role:"店长", type:"manager" },
  { id:"xiaoxue",  name:"小雪",   role:"销售", type:"sales"   },
  { id:"xiaotao",  name:"小桃",   role:"销售", type:"sales"   },
  { id:"zhugk",    name:"朱国坤", role:"财务", type:"finance" },
  { id:"qiujb",    name:"邱家斌", role:"配送", type:"delivery"}
];

/* ============ 计算 ============ */
const r2 = n => Math.round(n*100)/100;                     // 浮点误差修到分
const y = n => "¥" + r2(n).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2});
// 业绩奖金：返回金额和明细文案
function perfBonus(p){
  for (const t of RULES.perfBonus){
    if (p < t.min) continue;
    const units = Math.floor(p/100000);
    return { amt: units * t.per100k, note: `业绩奖金（${units} 个 10 万 × ${t.per100k} 元）` };
  }
  const need = RULES.perfBonus[RULES.perfBonus.length-1].min;
  return { amt: 0, note: `业绩奖金 — 总店未达 ${need/WAN} 万，无奖金`, miss: true };
}

// 个人业绩提成：店长、销售共用
function personalCommission(acd, b, lines){
  const total = acd + b;
  const tier = RULES.tiers.find(t => total >= t.min);
  if (!tier){
    lines.push(["个人提成 — 未达 15 万门槛，差 " + y(RULES.floor - total), 0, "miss"]);
    return 0;
  }
  const ca = r2(acd * tier.acd), cb = r2(b * tier.b);
  lines.push(["个人业绩合计 " + y(total) + " → 满 " + (tier.min/WAN) + " 万档", null]);
  lines.push(["A/C/D 类提成（" + (tier.acd*100) + "%）", ca]);
  lines.push(["B 类提成（" + (tier.b*100) + "%）", cb]);
  return ca + cb;
}

// 请假扣款：超出每月正常休息天数的部分，先扣全勤奖，再按日薪扣天
function leaveDeduct(R, days, monthDays, lines){
  if (days <= 0) return 0;
  const n = x => x.toLocaleString("zh-CN");
  if (days <= R.freeDays){
    lines.push([`请假 ${days} 天 — 在每月 ${R.freeDays} 天正常休息内，不扣`, null]);
    return 0;
  }
  let sum = 0;
  if (R.pay.attend > 0){
    lines.push([`请假超过 ${R.freeDays} 天 — 扣全勤奖`, -R.pay.attend]);
    sum += R.pay.attend;
  }
  const over = days - R.freeDays;
  const amt = r2(R.dailyBase / monthDays * over);
  lines.push([`请假扣款（${n(R.dailyBase)} ÷ ${monthDays} 天 × ${over} 天）`, -amt]);
  return sum + amt;
}

function calc(emp, v, storePerf, monthDays){
  const acd = v.acd||0, b = v.b||0, adj = v.adj||0, leave = v.leave||0;
  const R0 = RULES[emp.type];
  const lines = [];
  let base = 0, extra = 0;

  if (emp.type === "manager"){
    base = RULES.manager.base;
    lines.push(["底薪（" + RULES.manager.baseNote + "）", base]);
    // 总店提成：总店业绩没到门槛就没有这一项，个人提成照算
    let sc = 0;
    if (storePerf >= RULES.store.min){
      sc = r2(storePerf * RULES.store.rate);
      lines.push(["总店提成（" + y(storePerf) + " × 千分之一）", sc]);
    } else {
      lines.push(["总店提成 — 总店未达 " + (RULES.store.min/WAN) + " 万，无提成（差 " + y(RULES.store.min - storePerf) + "）", 0, "miss"]);
    }
    extra = sc + personalCommission(acd, b, lines);
  }

  if (emp.type === "sales"){
    base = RULES.sales.base;
    lines.push(["底薪（" + RULES.sales.baseNote + "）", base]);
    extra = personalCommission(acd, b, lines);
  }

  if (emp.type === "finance" || emp.type === "delivery"){
    const R = RULES[emp.type];
    base = R.base;
    lines.push(["底薪（" + R.baseNote + "）", base]);
    if (emp.type === "delivery"){
      const trips = v.trips||0;
      const tc = trips * R.perTrip;
      lines.push(["送货提成（" + trips + " 趟 × " + R.perTrip + " 元）", tc]);
      extra += tc;
    }
    const bonus = perfBonus(storePerf);
    lines.push([bonus.note, bonus.amt, bonus.miss ? "miss" : ""]);
    extra += bonus.amt;
  }

  const deduct = leaveDeduct(R0, leave, monthDays, lines);
  if (adj !== 0) lines.push([adj > 0 ? "其他补贴 / 奖励" : "其他扣款", adj]);
  return { base, extra, adj, deduct, total: r2(base + extra + adj - deduct), lines };
}

/* ============ 渲染 ============ */
// [字段名, 标签, 是不是金额（金额步进 1000，天数/趟数步进 1）]
const FIELDS = {
  manager:  [["acd","个人 A/C/D 类业绩（元）",1],["b","个人 B 类业绩（元）",1],["leave","请假天数",0],["adj","其他增减（元，可负）",1]],
  sales:    [["acd","A/C/D 类业绩（元）",1],["b","B 类业绩（元）",1],["leave","请假天数",0],["adj","其他增减（元，可负）",1]],
  finance:  [["leave","请假天数",0],["adj","其他增减（元，可负）",1]],
  delivery: [["trips","送货趟数",0],["leave","请假天数",0],["adj","其他增减（元，可负）",1]]
};
const RULETEXT = {
  manager:  "底薪 8,000 ｜ 总店满 60 万才有总店提成：总店业绩 × 千分之一 ｜ 个人业绩满 15 万起提：15 万档 A/C/D 1%、B 0.5%；20 万档 A/C/D 2%、B 1% ｜ 请假第 1 天起按 8,000 ÷ 当月天数扣",
  sales:    "底薪 4,500 ｜ 个人业绩满 15 万起提：15 万档 A/C/D 1%、B 0.5%；20 万档 A/C/D 2%、B 1% ｜ 每月 2 天正常休息，超出先扣全勤 500，再按 4,000 ÷ 当月天数扣天",
  finance:  "底薪 6,800 ｜ 总店满 40 万：每 10 万奖 100（40 万 = 400）；满 60 万翻倍：每 10 万奖 200（70 万 = 1,400）；不满 40 万无奖金 ｜ 每月 2 天正常休息，超出先扣全勤 100，再按 6,700 ÷ 当月天数扣天",
  delivery: "底薪 5,800 ｜ 每趟 15 元 ｜ 总店满 40 万：每 10 万奖 100；满 60 万翻倍：每 10 万奖 200 ｜ 每月 2 天正常休息，超出先扣全勤 100，再按 5,700 ÷ 当月天数扣天"
};

const KEY = "gc-salary-v3";   // v3 起业绩填回元，旧存档单位不同，不复用
let saved = JSON.parse(localStorage.getItem(KEY) || "{}");
let data = {};

document.getElementById("staff").innerHTML = STAFF.map(e => `
  <div class="card">
    <h2>${e.name}<span class="tag">${e.role}</span></h2>
    <p class="rule">${RULETEXT[e.type]}</p>
    <div class="grid">
      ${FIELDS[e.type].map(([k,l,isMoney]) => `
        <div>
          <label>${l}</label>
          <input type="number" step="${isMoney?1000:1}" ${k==='leave'?'min="0"':''} data-emp="${e.id}" data-k="${k}" placeholder="0">
        </div>`).join("")}
    </div>
    <div class="out" id="out-${e.id}"></div>
  </div>`).join("");

document.getElementById("storePerf").value = saved.storePerf ?? "";
// 本月天数：没存过就按当前月份的实际天数填
const now = new Date();
document.getElementById("monthDays").value =
  saved.monthDays || new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
document.querySelectorAll("input[data-emp]").forEach(i => {
  const v = saved[i.dataset.emp]?.[i.dataset.k];
  if (v !== undefined && v !== null) i.value = v;
});

function readAll(){
  const d = {
    storePerf: +document.getElementById("storePerf").value || 0,
    monthDays: +document.getElementById("monthDays").value || 30
  };
  STAFF.forEach(e => d[e.id] = {});
  document.querySelectorAll("input[data-emp]").forEach(i => {
    d[i.dataset.emp][i.dataset.k] = +i.value || 0;
  });
  return d;
}

// 存页面上原样填的数字
function saveRaw(){
  const r = {
    storePerf: document.getElementById("storePerf").value,
    monthDays: document.getElementById("monthDays").value
  };
  STAFF.forEach(e => r[e.id] = {});
  document.querySelectorAll("input[data-emp]").forEach(i => {
    r[i.dataset.emp][i.dataset.k] = i.value;
  });
  localStorage.setItem(KEY, JSON.stringify(r));
}

let lastText = "";
function render(){
  data = readAll();
  saveRaw();
  const sp = data.storePerf, md = data.monthDays;
  let grand = 0, rows = "", txt = "总店业绩 " + y(sp) + "｜本月 " + md + " 天\n\n";

  STAFF.forEach(e => {
    const r = calc(e, data[e.id], sp, md);
    grand += r.total;
    document.getElementById("out-" + e.id).innerHTML =
      r.lines.map(([t,v,cls]) =>
        v === null
          ? `<div class="row muted"><span>${t}</span><span></span></div>`
          : `<div class="row ${cls||""}"><span class="${cls||""}">${t}</span><span class="${v<0?"neg":""}">${v<0?"-"+y(-v):y(v)}</span></div>`
      ).join("") +
      `<div class="row total"><span>实发合计</span><span>${y(r.total)}</span></div>`;

    // 汇总表把「请假扣款 + 其他增减」并成一列「扣减」，明细在上面各人卡片里
    const net = r2(r.adj - r.deduct);
    rows += `<tr><td>${e.name}</td><td>${y(r.base)}</td><td>${y(r.extra)}</td><td class="${net<0?"neg":""}">${net?(net<0?"-"+y(-net):"+"+y(net)):"—"}</td><td>${y(r.total)}</td></tr>`;
    txt += `${e.name}（${e.role}）\n` + r.lines.filter(l=>l[1]!==null).map(l=>`  ${l[0]}：${l[1]<0?"-"+y(-l[1]):y(l[1])}`).join("\n") + `\n  实发合计：${y(r.total)}\n\n`;
  });

  document.getElementById("sumBody").innerHTML = rows;
  document.getElementById("sumAll").textContent = y(grand);
  lastText = txt + "全店工资合计：" + y(grand);
}

document.addEventListener("input", e => { if (e.target.matches("input[type=number]")) render(); });

function copyText(){
  navigator.clipboard.writeText(lastText).then(
    () => alert("明细已复制"),
    () => alert("复制失败，请手动选中复制")
  );
}
function resetAll(){
  if (!confirm("清空所有已填数据？")) return;
  localStorage.removeItem(KEY);
  document.querySelectorAll("input[type=number]").forEach(i => i.value = "");
  render();
}

render();
</script>
</body>
</html>
